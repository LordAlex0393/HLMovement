name: HLMovement
version: '${project.version}'
main: org.lordalex.hlmovement.HLMovement
author: Lord_Alex
api-version: 1.8
depend: [ProtocolLib]
commands:
  hl:
    description: Управление плагином HL Movement
    usage: /hl
    permission: hlmovement.use
permissions:
  hlmovement.use:
    default: true
  hlmovement.reload:
    default: op